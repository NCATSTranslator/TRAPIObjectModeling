---
name: Auto-Publish with approval

on:
  push:
    branches: [main]

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      is-new: ${{ steps.detect-state.outputs.is-new }}
      version: ${{ steps.detect-state.outputs.version }}
      changelog: ${{ steps.detect-state.outputs.changelog }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: detect-state
        uses: tokebe/pyproject-gh-release@v1
        with:
          create-release: false

  release:
    needs: detect
    if: needs.detect.outputs.is-new == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

        # Make gh release
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.detect.outputs.version }}
          name: v${{ needs.detect.outputs.version }}
          body: ${{ needs.detect.outputs.changelog }}

        # Build + publish package
      - name: Install uv
        uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: false # Protect against cache poisoning
      - name: Install Python 3.10
        run: uv python install 3.10
      - name: Build
        run: uv build
      # Check that basic features work and we didn't miss include crucial files
      # (both version trees ship in the package, so smoke-test each).
      - name: Smoke test (wheel)
        run: |
          uv run --isolated --no-project --with dist/*.whl tests/v2_0/test_models/test_models.py
          uv run --isolated --no-project --with dist/*.whl tests/v1_6/test_models/test_models.py
      - name: Smoke test (source distribution)
        run: |
          uv run --isolated --no-project --with dist/*.tar.gz tests/v2_0/test_models/test_models.py
          uv run --isolated --no-project --with dist/*.tar.gz tests/v1_6/test_models/test_models.py
      - name: Publish
        run: uv publish
